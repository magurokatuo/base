<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>野球スコアブック</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>野球スコアブック</h1>
    <div id="game-info">
        <input type="text" id="visitor-team-name" placeholder="ビジターチーム">
        <span>VS</span>
        <input type="text" id="home-team-name" placeholder="ホームチーム">
    </div>

    <div id="controls">
        <button id="reset-button">リセット</button>
    </div>

    <table id="scoreboard">
        <thead>
            <tr>
                <th>選手</th>
                <th>1</th>
                <th>2</th>
                <th>3</th>
                <th>4</th>
                <th>5</th>
                <th>6</th>
                <th>7</th>
                <th>8</th>
                <th>9</th>
                <th>R</th>
                <th>H</th>
                <th>E</th>
            </tr>
        </thead>
        <tbody id="visitor-body" class="team-body">
            <!-- JS will generate player rows and a total row here -->
        </tbody>
        <tbody id="home-body" class="team-body">
            <!-- JS will generate player rows and a total row here -->
        </tbody>
    </table>

    <div id="rosters-container">
        <div id="visitor-roster" class="roster-box">
            <h2>ビジターチーム選手名簿</h2>
            <ol>
                <li><input type="text" placeholder="1番選手"></li>
                <li><input type="text" placeholder="2番選手"></li>
                <li><input type="text" placeholder="3番選手"></li>
                <li><input type="text" placeholder="4番選手"></li>
                <li><input type="text" placeholder="5番選手"></li>
                <li><input type="text" placeholder="6番選手"></li>
                <li><input type="text" placeholder="7番選手"></li>
                <li><input type="text" placeholder="8番選手"></li>
                <li><input type="text" placeholder="9番選手"></li>
            </ol>
        </div>
        <div id="home-roster" class="roster-box">
            <h2>ホームチーム選手名簿</h2>
            <ol>
                <li><input type="text" placeholder="1番選手"></li>
                <li><input type="text" placeholder="2番選手"></li>
                <li><input type="text" placeholder="3番選手"></li>
                <li><input type="text" placeholder="4番選手"></li>
                <li><input type="text" placeholder="5番選手"></li>
                <li><input type="text" placeholder="6番選手"></li>
                <li><input type="text" placeholder="7番選手"></li>
                <li><input type="text" placeholder="8番選手"></li>
                <li><input type="text" placeholder="9番選手"></li>
            </ol>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
